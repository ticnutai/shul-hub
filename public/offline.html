<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אין חיבור</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e3a5f; color: #fff;
             font-family: system-ui, "Assistant", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { opacity: .85; margin: 0 0 24px; }
      button { font: inherit; font-size: 1.1rem; padding: 12px 28px; border: 0; border-radius: 999px; background: #d4af37; color: #1e3a5f; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>אין חיבור לאינטרנט</h1>
      <p>האפליקציה תיטען מחדש כשהחיבור יחזור.</p>
      <button type="button" onclick="location.href='https://shul-hub.lovable.app/'">ניסיון חוזר</button>
    </main>
    <script>
      window.addEventListener("online", () => { location.href = "https://shul-hub.lovable.app/"; });
      setInterval(() => { if (navigator.onLine) fetch("https://shul-hub.lovable.app/robots.txt", { cache: "no-store" }).then(() => { location.href = "https://shul-hub.lovable.app/"; }).catch(() => {}); }, 15000);
    </script>
  </body>
</html>
