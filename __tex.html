<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  body{margin:0;background:#111;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;font:12px system-ui;color:#fff}
  .cell{position:relative;height:300px;border-radius:6px;overflow:hidden}
  .cell b{position:absolute;inset:auto 6px 6px auto;background:#000a;padding:2px 6px;border-radius:4px}
  svg{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body>

<!-- 1. marble: fractal noise stretched into veins, lit from above -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="marble" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="6" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.90  0 0 0 0 0.82  1.6 0 0 0 -0.3" result="v"/>
    <feGaussianBlur in="v" stdDeviation="0.6" result="vb"/>
    <feComposite in="vb" in2="SourceGraphic" operator="over"/>
  </filter></defs>
  <rect width="400" height="300" fill="#f4efe2"/>
  <rect width="400" height="300" fill="#f4efe2" filter="url(#marble)"/>
</svg><b>marble A</b></div>

<!-- 2. marble with lighting relief -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="marble2">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.045" numOctaves="7" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.42  2.4 0 0 0 -0.75" result="veins"/>
    <feGaussianBlur in="veins" stdDeviation="0.4" result="vb"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="vb"/></feMerge>
  </filter></defs>
  <rect width="400" height="300" fill="#efe8d8" filter="url(#marble2)"/>
</svg><b>marble B (veins)</b></div>

<!-- 3. walnut wood: noise stretched along the grain -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="wood">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.09" numOctaves="5" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.09  0 0 0 0 0.03  1.3 0 0 0 -0.2" result="grain"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
  </filter></defs>
  <rect width="400" height="300" fill="#6b3a1c" filter="url(#wood)"/>
</svg><b>walnut</b></div>

<!-- 4. brushed gold: bump-mapped specular -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c9"/><stop offset=".35" stop-color="#e3bd5c"/>
    <stop offset=".55" stop-color="#a9821f"/><stop offset=".8" stop-color="#f0d68f"/><stop offset="1" stop-color="#8a6a1a"/>
  </linearGradient>
  <filter id="gold">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="2" seed="5" result="bump"/>
    <feDiffuseLighting in="bump" surfaceScale="1.4" diffuseConstant="1" lighting-color="#fff8e0" result="li">
      <feDistantLight azimuth="235" elevation="55"/>
    </feDiffuseLighting>
    <feComposite in="li" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/>
  </filter></defs>
  <rect width="400" height="300" fill="url(#g4)" filter="url(#gold)"/>
</svg><b>brushed gold</b></div>

<!-- 5. jerusalem stone: rough lit surface -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="stone">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="2" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="2.2" diffuseConstant="1.05" lighting-color="#fdf6e6" result="li">
      <feDistantLight azimuth="225" elevation="52"/>
    </feDiffuseLighting>
    <feComposite in="li" in2="SourceGraphic" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0"/>
  </filter></defs>
  <rect width="400" height="300" fill="#e3d8bd" filter="url(#stone)"/>
</svg><b>jerusalem stone</b></div>

<!-- 6. parchment -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="parch">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.5  0 0 0 0 0.3  0.55 0 0 0 -0.08" result="stain"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="stain"/></feMerge>
  </filter></defs>
  <rect width="400" height="300" fill="#f6ecd4" filter="url(#parch)"/>
</svg><b>parchment</b></div>

<!-- 7. deep velvet -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="velvet">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="4" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="0.9" diffuseConstant="1" lighting-color="#c98" result="li">
      <feDistantLight azimuth="210" elevation="35"/>
    </feDiffuseLighting>
    <feComposite in="li" in2="SourceGraphic" operator="arithmetic" k1="1.1" k2="0" k3="0" k4="0"/>
  </filter></defs>
  <rect width="400" height="300" fill="#5c0d1c" filter="url(#velvet)"/>
</svg><b>velvet</b></div>

<!-- 8. gold with stronger relief for frames -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="gold2">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="3" seed="8" result="bump"/>
    <feSpecularLighting in="bump" surfaceScale="2" specularConstant="1.1" specularExponent="22" lighting-color="#fffbe8" result="spec">
      <feDistantLight azimuth="230" elevation="60"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceGraphic" operator="in" result="spec2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="spec2"/></feMerge>
  </filter>
  <linearGradient id="g8" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6a1a"/><stop offset=".3" stop-color="#f6e3a8"/>
    <stop offset=".5" stop-color="#c9a227"/><stop offset=".7" stop-color="#fff3c9"/><stop offset="1" stop-color="#9c7a22"/>
  </linearGradient></defs>
  <rect width="400" height="300" fill="url(#g8)" filter="url(#gold2)"/>
</svg><b>gold relief</b></div>

<!-- 9. dark marble -->
<div class="cell"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><defs>
  <filter id="dark">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="6" seed="15" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.62  1.1 0 0 0 -0.45" result="v"/>
    <feGaussianBlur in="v" stdDeviation="0.5"/>
    <feComposite in2="SourceGraphic" operator="over"/>
  </filter></defs>
  <rect width="400" height="300" fill="#1a2740"/>
  <rect width="400" height="300" fill="#1a2740" filter="url(#dark)"/>
</svg><b>dark marble</b></div>

</body></html>
