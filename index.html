<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="חומשי תורה" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- DNS prefetch and preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Primary fonts loaded non-render-blocking. The display=swap query keeps the
         system font stack visible until the web font is ready, eliminating the FOIT
         that previously caused a perceptible re-render after the SW resolved fonts. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;700;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;700;900&display=swap">
    </noscript>
    <!-- Secondary fonts are loaded lazily to avoid startup render stalls -->
    <script>
      (function () {
        var href = "https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Miriam+Libre:wght@400;700&family=Rubik:wght@400;700&family=Heebo:wght@400;700&family=Alef:wght@400;700&family=Varela+Round&family=Assistant:wght@400;700&family=Secular+One&family=Suez+One&display=swap";
        var loadSecondaryFonts = function () {
          if (document.querySelector('link[data-font-pack="secondary-hebrew"]')) return;
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.setAttribute("data-font-pack", "secondary-hebrew");
          document.head.appendChild(link);
        };

        var schedule = function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadSecondaryFonts, { timeout: 4000 });
          } else {
            setTimeout(loadSecondaryFonts, 2000);
          }
        };

        if (document.readyState === "complete") {
          schedule();
        } else {
          window.addEventListener("load", schedule, { once: true });
        }
      })();
    </script>
    <title>בית כנסת בסר 3 — תורה וקהילה</title>
    <meta name="description" content="בית כנסת בסר 3: זמני תפילות, שיעורים, חברותות, מודעות, חומש מלא עם מפרשים וסידור תפילה." />
    <meta name="author" content="בית כנסת בסר 3" />
    <meta name="keywords" content="בית כנסת, בני ברק, זמני תפילות, תורה, חומש, סידור, פירושים, שיעורים" />

    <meta property="og:title" content="בית כנסת בסר 3 — תורה וקהילה" />
    <meta property="og:description" content="זמני תפילות וקהילה לצד חומש מלא עם מפרשים וסידור תפילה." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512x512.png" />
  </head>
